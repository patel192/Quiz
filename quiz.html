<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Quiz</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <!-- main container -->
  <div class="quiz-container">
    <!-- Header -->
    <header class="header">
      <h1>✨ Interactive Quiz ✨</h1>
    </header>

    <!-- Welcome Section -->
    <section class="welcome" id="welcomeSection">
      <h2>Welcome to the Interactive Quiz!</h2>
      <p>
        Test your knowledge, challenge your mind, and see how well you know your stuff. Ready to begin?
      </p>
      <div class="button-group">
        <button class="btn start-btn" id="startQuiz">Yes, Let’s Go!</button>
        <button class="btn exit-btn" id="endQuiz">Maybe Later</button>
      </div>
    </section>

    <!-- Quiz Section -->
    <section id="quizSection" class="hidden">
      <h2 id="question"></h2>
      <div class="timer" id="timer">Time Left: 15s</div>
      <form id="optionsForm" class="options"></form>
      <div class="controls">
        <button id="nextBtn" class="btn">Next</button>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>

</html>
